<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="page">
        <div class="auth-box">
            <div class="form-area">
                <div class="brand">
                    <img src="assets/img/logo.svg" alt="Logo">
                    <span>MyPanel</span>
                </div>

                <h1>Giriş Yap</h1>
                <p class="small-text">Hesabınıza giriş yapmak için bilgilerinizi yazın.</p>

                <form id="loginForm">
                    <div class="input-group">
                        <label for="loginEmail">E-posta</label>
                        <input type="email" id="loginEmail" placeholder="ornek@mail.com">
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Şifre</label>
                        <div class="password-box">
                            <input type="password" id="loginPassword" placeholder="Şifrenizi yazın">
                            <button type="button" class="show-password" data-target="loginPassword">Göster</button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember">
                            <input type="checkbox" id="rememberMe">
                            <span>Beni hatırla</span>
                        </label>
                        <a href="#" id="forgotPassword">Şifremi unuttum?</a>
                    </div>

                    <button class="main-button" type="submit">Giriş Yap</button>
                    <div class="message" id="loginMessage"></div>
                </form>

                <p class="bottom-text">
                    Hesabınız yok mu?
                    <a href="register.html">Kayıt olun</a>
                </p>
            </div>

            <div class="side-area">
                <div class="side-content">
                    <span class="side-label">HOŞ GELDİNİZ</span>
                    <h2>Hesabınıza<br>kolayca ulaşın.</h2>
                    <p>Bilgilerinizi girerek hesabınıza hızlı bir şekilde giriş yapabilirsiniz.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
