{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'api/assets/css/style.css' %}">
    <title>Login</title>
</head>
<body>
    <main>
        <section class="loginRegisterApp">
            <div class="container">
                <div class="loginHeadText">
                    <p>Login</p>
                    <hr>
                </div>
                <div class="content">
                    <form id="loginForm">
                        <input type="email" id="email" placeholder="Enter Your E-Mail Adress" class="emailTextBox" required><br/>
                        <br>
                        <input type="password" id="password" placeholder="Enter Your Password" class="passwordTextBox" required><br>
                        <br>
                        <input type="checkbox" id="rememberMe" class="checktBoxLogin">
                        <label for="rememberMe" class="rememberMeLogin">Remember me</label>
                        <a href="#" class="linkForgotPassword">Forgot Password</a><br><br><br>
                        <button type="submit" class="submitLoginNowLogin">Login Now</button><br><br>
                        <p class="textLogin">Don't have an account?</p>
                        <a href="{% url 'register-page' %}" class="linkRegisterLogin">Signup Now</a>
                        <p id="loginMessage" class="formMessage"></p>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="{% static 'api/assets/js/script.js' %}"></script>
</body>
</html>
